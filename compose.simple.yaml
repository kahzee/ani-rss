services:
  ani-rss-simple:
    build:
      context: .
      dockerfile: Dockerfile.simple
    image: ani-rss-simple:local
    restart: unless-stopped
    ports:
      - "7789:7789"
    environment:
      CONFIG: /config
      TZ: Asia/Shanghai
    volumes:
      - ./config:/config
      - ${MEDIA_ROOT:-./media}:/Media
