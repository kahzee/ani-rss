name: Simple tracking

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [simple-tracking]

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test the simple workflow
        run: mvn -B -ntp '-Dtest=ani.rss.simple.*Test' -Dsurefire.failIfNoSpecifiedTests=false package
      - name: Assemble portable package
        run: |
          mkdir -p release/docs
          cp ani-rss-application/target/ani-rss.jar release/
          cp start-simple.cmd start-simple.ps1 Dockerfile.simple compose.simple.yaml LICENSE release/
          cp docs/simple-tracking.md release/docs/
      - uses: actions/upload-artifact@v4
        with:
          name: ani-rss-simple
          path: release/
